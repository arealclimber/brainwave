[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Audio storage uses /tmp by default (no persistent volume needed)
# Audio files persist for the lifetime of the container (cleared on redeploy/restart)

[experimental]
incrementalBuild = true