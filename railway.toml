[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Audio storage uses /tmp by default (no persistent volume needed)
# Audio files are temporary and cleaned up after use or within 24 hours

[experimental]
incrementalBuild = true