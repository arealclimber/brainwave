<!DOCTYPE html>
<html>
  <head>
    <title>Clarifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Real-time speech recognition and AI-powered text enhancement"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="static/favicon.ico" />
    <link rel="apple-touch-icon" href="static/favicon.ico" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4A90E2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brainwave" />
    <link rel="manifest" href="static/manifest.json" />

    <link rel="stylesheet" type="text/css" href="static/style.css?v=2" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: ['selector', '.dark-theme'] }
    </script>
  </head>
  <body>
    <!-- Toast messages -->
    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <div class="container">
      <!-- Top status bar -->
      <div class="status-bar">
        <button id="themeToggle" class="theme-toggle">🌙</button>
        <div class="relative">
          <button id="recentNotesToggle" class="theme-toggle" title="Recent Notes">📋</button>
          <div id="recentNotesDropdown" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 w-96 max-h-[500px] overflow-y-auto bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-xl shadow-xl z-50">
            <div id="recentNotesList" class="p-2">
              <div class="text-center py-5 text-gray-400 text-sm">Loading...</div>
            </div>
          </div>
        </div>
        <div id="timer" class="timer">00:00</div>
        <div id="connectionStatus" class="connection-status"></div>
      </div>
      <!-- Top controls -->
      <div class="top-controls">
        <div class="record-section">
          <button id="recordButton">Start</button>
          <label class="dual-channel-toggle">
            <input type="checkbox" id="saveToSheetCheckbox" checked />
            <span>Sheet</span>
          </label>
        </div>
        <div class="todo-row">
          <label class="dual-channel-toggle">
            <input type="checkbox" id="todoCheckbox" />
            <span>Todo</span>
          </label>
        </div>
        <!-- Mobile only: Sheet, Todo in one row -->
        <div class="mobile-checkbox-row">
          <label class="dual-channel-toggle">
            <input type="checkbox" id="saveToSheetCheckboxMobile" checked />
            <span>Sheet</span>
          </label>
          <label class="dual-channel-toggle">
            <input type="checkbox" id="todoCheckboxMobile" />
            <span>Todo</span>
          </label>
        </div>
        <div class="transcription-actions">
          <button
            id="confirmNotionButton"
            class="action-button primary"
            disabled
          >
            Save to Notion
          </button>
          <button id="builderButton" class="action-button" disabled>
            Builder
          </button>
          <button id="builderLongButton" class="action-button" disabled>
            Builder(hr)
          </button>
          <button id="geminiButton" class="action-button" disabled>
            Gemini
          </button>
          <button id="saveAudioButton" class="action-button" disabled>
            Save Audio
          </button>
        </div>
      </div>
      <!-- Single textbox container (initial display) -->
      <div id="singleTranscriptContainer" class="transcript-container">
        <div class="copy-button-container">
          <button id="copyButton" class="copy-button">Copy</button>
        </div>
        <textarea id="transcript"></textarea>
      </div>
      <!-- Multi textbox container (hidden initially, shown on batch transcribe) -->
      <div
        id="multiTranscriptContainer"
        class="multi-transcript-container hidden"
      >
        <div class="transcript-box selected" id="openaiBox">
          <div class="box-header">
            <label>Original</label>
            <button class="copy-btn-small" id="copyOpenaiBtn">Copy</button>
          </div>
          <textarea id="openaiTranscript"></textarea>
        </div>
        <div class="transcript-box hidden" id="builderBox">
          <div class="box-header">
            <label>Builder</label>
            <button class="copy-btn-small" id="copyBuilderBtn">Copy</button>
          </div>
          <textarea id="builderTranscript"></textarea>
        </div>
        <div class="transcript-box hidden" id="builderLongBox">
          <div class="box-header">
            <label>Builder(hr)</label>
            <button class="copy-btn-small" id="copyBuilderLongBtn">Copy</button>
          </div>
          <textarea id="builderLongTranscript"></textarea>
        </div>
        <div class="transcript-box hidden" id="geminiBox">
          <div class="box-header">
            <label>Gemini</label>
            <button class="copy-btn-small" id="copyGeminiBtn">Copy</button>
          </div>
          <textarea id="geminiTranscript"></textarea>
        </div>
      </div>
      <div class="button-container">
        <button id="readabilityButton" class="action-button">
          Readability
        </button>
        <button id="correctnessButton" class="action-button">
          Correctness
        </button>
        <button id="askAIButton" class="action-button">Ask AI</button>
      </div>
      <!-- Enhanced section with tabs -->
      <div class="enhanced-section">
        <!-- Tab row + source -->
        <div class="result-tabs">
          <button class="result-tab" id="tabRead" disabled>Read</button>
          <button class="result-tab" id="tabCorrected" disabled>
            Corrected
          </button>
          <button class="result-tab" id="tabAsked" disabled>Asked</button>
          <button class="copy-btn-small" id="copyEnhancedButton">Copy</button>
          <span class="result-source" id="resultSource"></span>
        </div>
        <!-- Textarea -->
        <div class="enhanced-transcript-container">
          <textarea id="enhancedTranscript"></textarea>
        </div>
      </div>
    </div>
    <!-- Note detail modal -->
    <div id="noteModal" class="hidden fixed inset-0 z-[200] flex items-center justify-center">
      <div id="noteModalBackdrop" class="absolute inset-0 bg-black/50"></div>
      <div class="relative w-full max-w-2xl max-h-[80vh] mx-5 bg-white dark:bg-zinc-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 dark:border-zinc-700">
          <a id="noteModalLink" href="#" target="_blank" class="text-blue-500 hover:underline text-sm">Open in Notion</a>
          <button id="noteModalClose" class="text-2xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 leading-none">&times;</button>
        </div>
        <h2 id="noteModalTitle" class="px-5 pt-4 pb-2 font-semibold text-lg text-gray-900 dark:text-gray-100"></h2>
        <div id="noteModalBody" class="px-5 pb-5 overflow-y-auto text-sm text-gray-700 dark:text-gray-300 whitespace-pre-wrap leading-relaxed"></div>
      </div>
    </div>

    <script src="static/main.js?v=4"></script>
  </body>
</html>
