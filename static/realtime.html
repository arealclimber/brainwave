<!DOCTYPE html>
<html>
  <head>
    <title>Clarifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Real-time speech recognition and AI-powered text enhancement"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="static/favicon.ico" />
    <link rel="apple-touch-icon" href="static/favicon.svg" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4A90E2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brainwave" />
    <link rel="manifest" href="static/manifest.json" />

    <link rel="stylesheet" type="text/css" href="static/style.css" />
  </head>
  <body>
    <!-- Toast messages -->
    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <div class="container">
      <div id="connectionStatus" class="connection-status"></div>
      <button id="themeToggle" class="theme-toggle">🌙</button>
      <div
        id="timer"
        style="text-align: center; margin-bottom: 15px; font-size: 1.2rem"
      >
        00:00
      </div>
      <!-- 頂部控制列：Start 在左，Re-transcribe + Save to Notion 在右 -->
      <div class="top-controls">
        <button id="recordButton">Start</button>
        <div class="transcription-actions">
          <button id="retranscribeButton" class="action-button" disabled>
            Re-transcribe
          </button>
          <button
            id="confirmNotionButton"
            class="action-button primary"
            disabled
          >
            Save to Notion
          </button>
        </div>
      </div>
      <!-- 單一 textbox 容器（初始顯示） -->
      <div id="singleTranscriptContainer" class="transcript-container">
        <textarea id="transcript"></textarea>
        <button id="copyButton" class="copy-button">Copy</button>
      </div>
      <!-- 雙 textbox 容器（初始隱藏，Re-transcribe 後顯示） -->
      <div
        id="dualTranscriptContainer"
        class="dual-transcript-container hidden"
      >
        <div class="transcript-box" id="originalBox">
          <label>Original</label>
          <textarea id="originalTranscript"></textarea>
        </div>
        <div class="transcript-box selected" id="retranscribeBox">
          <label>Re-transcribed</label>
          <textarea id="retranscribedTranscript"></textarea>
        </div>
      </div>
      <div class="button-container">
        <button id="readabilityButton" class="action-button">
          Readability
        </button>
        <button id="correctnessButton" class="action-button">
          Correctness
        </button>
        <button id="askAIButton" class="action-button">Ask AI</button>
      </div>
      <div class="enhanced-transcript-container">
        <textarea id="enhancedTranscript"></textarea>
        <button id="copyEnhancedButton" class="copy-button">Copy</button>
      </div>
    </div>
    <script src="static/main.js"></script>
  </body>
</html>
